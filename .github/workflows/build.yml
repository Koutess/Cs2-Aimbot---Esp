# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cl /nologo /EHsc /O2 /std:c++17 /DUNICODE /D_UNICODE /I src /Fe:build\cs2_external.exe src\main.cpp /link user32.lib gdi32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-external
          path: build/cs2_external.exe
