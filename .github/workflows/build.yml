# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure + Build (no CMake generator issues)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" || call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cl /nologo /EHsc /O2 /std:c++17 /DUNICODE /D_UNICODE /I src /Fe:build\cs2_external.exe src\main.cpp /link user32.lib gdi32.lib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cs2-external
          path: build/cs2_external.exe
